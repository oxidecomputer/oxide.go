[[breaking]]
title = "Login methods removed"
description = "The `LoginLocal` and `LoginSaml` methods have been removed since they target endpoints expected to be called from a web browser. [#438](https://github.com/oxidecomputer/oxide.go/pull/438)"

[[features]]
title = "Use pointers for nullable array elements"
description = "Arrays with nullable elements are now generated as `[]*T` rather than `[]T`. [#437](https://github.com/oxidecomputer/oxide.go/pull/437)"

[[features]]
title = "Use pointers for nullable, optional objects"
description = "Objects that are nullable and optional are now generated as `*T` rather than `T`. [#444](https://github.com/oxidecomputer/oxide.go/pull/444)"

[[bugs]]
title = "Fixed `NewIpNet` parsing"
description = "Fixed a bug that could cause invalid strings to be accepted as valid NetIpNet values. [#440](https://github.com/oxidecomputer/oxide.go/pull/440)"

[[bugs]]
title = "Fixed path element escaping"
description = "Path elements were being escaped using the character set for query params. [#439](https://github.com/oxidecomputer/oxide.go/pull/439)"

[[enhancements]]
title = "Prevent mutations to input client"
description = "`NewClient` options now clone inputs to prevent mutations to inputs. [#441](https://github.com/oxidecomputer/oxide.go/pull/441)"
